server {
    listen 80;
    server_name chat.parlz.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.parlz.com;
    root /www/sites/chat.parlz.com/index;
    index index.php;
    client_max_body_size 80M;

    ssl_certificate     /www/sites/chat.parlz.com/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/chat.parlz.com/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    location = /config.php { return 404; }
    location = /router.php { return 404; }
    location ~ ^/(data|includes|tests)/ { return 404; }

    location ~* ^/assets/uploads/.*\.(webp|png|jpe?g|gif|mp4|webm|mov|mp3|wav|m4a|aac|ogg)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location /assets/uploads/ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(css|js)$ {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    location ~* ^/assets/.*\.(svg|webp|png|jpe?g|gif|ico)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location /assets/ { return 404; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/tmp/php-cgi-82.sock;
    }

    location / { return 404; }
}
