name: build-linux

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'client-linux/**'
      - '.github/workflows/build-linux.yml'
    tags:
      - 'v*'

jobs:
  deb-appimage:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            webkit: libwebkit2gtk-4.0-dev
            tag: ubuntu2204
          - runner: ubuntu-24.04
            webkit: libwebkit2gtk-4.1-dev
            tag: ubuntu2404
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev ${{ matrix.webkit }}

      - name: 环境信息
        run: |
          WEBKIT=$(pkg-config --exists webkit2gtk-4.1 && echo webkit2gtk-4.1 || echo webkit2gtk-4.0)
          echo "架构: $(uname -m) / pkg-config 名称: $WEBKIT / WebKitGTK 版本: $(pkg-config --modversion $WEBKIT)"
          INC=$(pkg-config --cflags-only-I $WEBKIT | tr ' ' '\n' | grep webkitgtk | head -1 | sed 's/^-I//')
          ls -1 "$INC/webkit2/" | grep -i network || echo "没有 WebKitNetworkSession 头文件（会用 WebKitWebContext 回退）"

      - name: 编译
        run: |
          cd client-linux
          chmod +x build.sh
          ./build.sh

      - name: 打 deb
        run: |
          cd client-linux
          chmod +x packaging/deb/build-deb.sh
          VERSION=1.0.0 ./packaging/deb/build-deb.sh

      - name: 打 AppImage
        if: matrix.tag == 'ubuntu2204'
        run: |
          cd client-linux
          chmod +x packaging/appimage/build-appimage.sh
          VERSION=1.0.0 ./packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-${{ matrix.tag }}
          path: |
            client-linux/dist/*.deb
            client-linux/dist/*.AppImage
          if-no-files-found: warn

  deb-appimage-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: 环境信息
        run: |
          echo "架构: $(uname -m) / WebKitGTK 版本: $(pkg-config --modversion webkit2gtk-4.1)"

      - name: 编译
        run: |
          cd client-linux
          chmod +x build.sh
          ./build.sh

      - name: 打 deb
        run: |
          cd client-linux
          chmod +x packaging/deb/build-deb.sh
          VERSION=1.0.0 ./packaging/deb/build-deb.sh

      - name: 打 AppImage
        run: |
          cd client-linux
          chmod +x packaging/appimage/build-appimage.sh
          VERSION=1.0.0 ./packaging/appimage/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-arm64
          path: |
            client-linux/dist/*.deb
            client-linux/dist/*.AppImage

  rpm:
    runs-on: ubuntu-latest
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: dnf install -y gcc make pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel rpm-build tar gzip

      - name: 编译并打 rpm
        run: |
          cd client-linux
          chmod +x build.sh packaging/rpm/build-rpm.sh
          ./build.sh
          VERSION=1.0.0 ./packaging/rpm/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-rpm
          path: client-linux/dist/*.rpm

  rpm-arm:
    runs-on: ubuntu-24.04-arm
    container: fedora:41
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: dnf install -y gcc make pkgconf-pkg-config gtk3-devel webkit2gtk4.1-devel rpm-build tar gzip

      - name: 编译并打 rpm
        run: |
          cd client-linux
          chmod +x build.sh packaging/rpm/build-rpm.sh
          ./build.sh
          VERSION=1.0.0 ./packaging/rpm/build-rpm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-rpm-arm64
          path: client-linux/dist/*.rpm

  apk:
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - name: 安装依赖
        run: |
          apk add --no-cache bash git build-base pkgconf gtk+3.0-dev tar gzip
          apk add --no-cache webkit2gtk-4.1-dev || apk add --no-cache webkit2gtk-4.0-dev

      - uses: actions/checkout@v4

      - name: 编译并打 apk
        run: |
          cd client-linux
          chmod +x build.sh packaging/alpine/build-apk.sh
          ./build.sh
          VERSION=1.0.0 ./packaging/alpine/build-apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-alpine
          path: client-linux/dist/*.apk

  apk-arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: 在 Alpine 容器里编译并打 apk
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.21 sh -c '
            set -e
            apk add --no-cache bash build-base pkgconf gtk+3.0-dev tar gzip
            apk add --no-cache webkit2gtk-4.1-dev || apk add --no-cache webkit2gtk-4.0-dev
            cd client-linux
            chmod +x build.sh packaging/alpine/build-apk.sh
            ./build.sh
            VERSION=1.0.0 ./packaging/alpine/build-apk.sh
          '

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-linux-alpine-arm64
          path: client-linux/dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - deb-appimage
      - deb-appimage-arm
      - rpm
      - rpm-arm
      - apk
      - apk-arm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.apk
