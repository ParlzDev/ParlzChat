name: build-windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'client-dotnet/**'
      - '.github/workflows/build-windows.yml'
    tags:
      - 'v*'

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            tag: x64
          - rid: win-arm64
            arch: arm64
            tag: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 发布自包含单文件 EXE
        run: >
          dotnet publish client-dotnet/ParlzClient.csproj
          -c Release -r ${{ matrix.rid }} -o out/${{ matrix.tag }}
          -p:PublishSingleFile=true -p:SelfContained=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none

      - name: 安装 WiX
        run: dotnet tool install --global wix --version "5.*"

      - name: 打 MSI 安装器
        run: |
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" build client-dotnet/installer/Parlz.wxs `
            -arch ${{ matrix.arch }} `
            -d PublishDir="${{ github.workspace }}\out\${{ matrix.tag }}" `
            -o "dist/Parlz-1.0.0-${{ matrix.tag }}.msi"

      - name: 收拢产物
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "out/${{ matrix.tag }}/Parlz.exe" "dist/Parlz-1.0.0-${{ matrix.tag }}.exe"
          Get-ChildItem dist | ForEach-Object { "{0}`t{1} B" -f $_.Name, $_.Length }

      - uses: actions/upload-artifact@v4
        with:
          name: Parlz-windows-${{ matrix.tag }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
